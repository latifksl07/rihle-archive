<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 200" width="100%" height="100%">
    <!-- RIHLE ARCHIVE - Kemer İkonu -->
    <defs>
        <style>
            .arch-line {
                fill: none;
                stroke: #251e19;
                stroke-width: 8;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .arch-base {
                stroke: #251e19;
                stroke-width: 9;
                stroke-linecap: square;
            }
            .terracotta-pillar {
                fill: #b85d38;
            }
        </style>
    </defs>
    <g transform="translate(5, 5)">
        <!-- Taban -->
        <line x1="16" y1="172" x2="148" y2="172" class="arch-base" />
        
        <!-- Dış Kemer -->
        <path d="M 26 172 L 26 95 C 26 56, 56 32, 82 25 C 108 32, 138 56, 138 95 L 138 172" class="arch-line" />
        
        <!-- İç Kemer -->
        <path d="M 46 172 L 46 100 C 46 72, 66 54, 82 48 C 98 54, 118 72, 118 100 L 118 172" class="arch-line" />
        
        <!-- Kiremit Sütun -->
        <polygon points="69,172 95,172 87,70 82,62 77,70" class="terracotta-pillar" />
    </g>
</svg>

